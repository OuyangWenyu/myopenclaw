services:
  # ── Hermes gateway（自定义镜像：含 opencode + gh CLI + lark-cli）──
  hermes:
    build:
      context: ./docker/hermes
      dockerfile: Dockerfile
      args:
        - GITHUB_TOKEN=${GH_TOKEN:-}
    image: myopenclaw/hermes:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "${HERMES_PORT:-8642}:8642"
    volumes:
      - ${HOME}/.hermes:/opt/data
      - ${HOME}/.config/gh:/opt/gh-config
      - ${HOME}/.config/opencode:/opt/opencode-config
      - ${HOME}/.lark-cli:/opt/lark-config
      - ${HOME}/Zotero:/opt/zotero-data:ro
      - ./skills/morning-briefing:/opt/hermes-skills/morning-briefing:ro
      - ./skills/morning-triage-v2:/opt/hermes-skills/morning-triage-v2:ro
      - ${HOME}/code/aisecretary/skills:/opt/data/code/aisecretary/skills:ro
      - ./skills/daily-dev-report:/opt/hermes-skills/daily-dev-report:ro
      - ./skills/yuque-knowledge:/opt/hermes-skills/yuque-knowledge:ro
      - ./skills/yuque-daily-digest:/opt/hermes-skills/yuque-daily-digest:ro
      - ${HOME}/.myagentdata:/opt/myagentdata:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      - GH_TOKEN=${GH_TOKEN:-}              # gh CLI natively reads this (不会被 Hermes 黑名单匹配)
      - GITHUB_TOKEN=${GH_TOKEN:-}
      - GITCODE_TOKEN=${GITCODE_TOKEN:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - KIMI_CN_API_KEY=${MOONSHOT_API_KEY:-}
      # Blocked by Hermes env blacklist, materialized to secrets files by entrypoint
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XIAOMI_API_KEY=${XIAOMI_API_KEY:-}       # Xiaomi MiMo — 主模型已切 deepseek-flash，此注入当前无消费方（待清理）
      # Outlook OAuth（非机密配置，repo .env 单一来源；token 由 ortie 管理，不经环境传递）
      - EMAIL_OUTLOOK_ADDRESS=${EMAIL_OUTLOOK_ADDRESS:-}
      - EMAIL_OUTLOOK_ACCOUNT_NAME=${EMAIL_OUTLOOK_ACCOUNT_NAME:-}
      - EMAIL_OUTLOOK_DISPLAY_NAME=${EMAIL_OUTLOOK_DISPLAY_NAME:-}
      - EMAIL_OUTLOOK_GRANT=${EMAIL_OUTLOOK_GRANT:-}
      - EMAIL_OUTLOOK_CLIENT_ID=${EMAIL_OUTLOOK_CLIENT_ID:-}
      - EMAIL_OUTLOOK_IMAP_HOST=${EMAIL_OUTLOOK_IMAP_HOST:-}
      - EMAIL_OUTLOOK_IMAP_PORT=${EMAIL_OUTLOOK_IMAP_PORT:-}
      - EMAIL_OUTLOOK_SMTP_HOST=${EMAIL_OUTLOOK_SMTP_HOST:-}
      - EMAIL_OUTLOOK_SMTP_PORT=${EMAIL_OUTLOOK_SMTP_PORT:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LARK_CLI_APP_ID=${LARK_CLI_APP_ID:-}
      - LARK_CLI_APP_SECRET=${LARK_CLI_APP_SECRET:-}
      - LARK_USER_OPEN_ID=${LARK_USER_OPEN_ID:-}
      - LARK_CLI_IDM_APP_ID=${LARK_CLI_IDM_APP_ID:-}
      - LARK_CLI_IDM_APP_SECRET=${LARK_CLI_IDM_APP_SECRET:-}
      - RCLONE_CONFIG=/opt/data/rclone/rclone.conf
      - ZOT_DATA_DIR=/opt/zotero-data
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID:-}
      - ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE:-user}
      - GDRIVE_PAPERS_LOCAL_PATH=${GDRIVE_PAPERS_LOCAL_PATH:-}
      # 语雀 MCP 访问 key：Hermes MCP 客户端按 ${VAR} 展开 config.yaml 的
      # Authorization Bearer header；不注入容器环境则展开为空 → 401 连接失败。
      # ~/.hermes/.env 里的同名变量不参与 MCP 客户端展开。
      - MCP_YUQUE_MCP_API_KEY=${MCP_YUQUE_MCP_API_KEY:-}
      - MEMORY_TENCENTDB_GATEWAY_HOST=tdai-memory
      - MEMORY_TENCENTDB_GATEWAY_PORT=8420
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_DOMAIN=feishu
      - FEISHU_CONNECTION_MODE=websocket
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - myopenclaw-net

  # ── Hermes coder gateway（编程助手，GLM-5.1）──────────────────
  hermes-coder:
    image: myopenclaw/hermes:latest
    container_name: hermes-coder
    restart: unless-stopped
    command: gateway run --profile coder --replace
    ports:
      - "${HERMES_CODER_PORT:-8643}:8642"
    volumes:
      - ${HOME}/.hermes:/opt/data
      - ${HOME}/.config/gh:/opt/gh-config
      - ${HOME}/.config/opencode:/opt/opencode-config
      - ${HOME}/.lark-cli:/opt/lark-config
      - ${HOME}/.gitcode:/opt/gitcode-config
      - ${HOME}/Zotero:/opt/zotero-data:ro
      - ./skills/morning-briefing:/opt/hermes-skills/morning-briefing:ro
      - ./skills/morning-triage-v2:/opt/hermes-skills/morning-triage-v2:ro
      - ${HOME}/code/aisecretary/skills:/opt/data/code/aisecretary/skills:ro
      - ./skills/daily-dev-report:/opt/hermes-skills/daily-dev-report:ro
      - ./skills/yuque-knowledge:/opt/hermes-skills/yuque-knowledge:ro
      - ./skills/yuque-daily-digest:/opt/hermes-skills/yuque-daily-digest:ro
      - ${HOME}/.myagentdata:/opt/myagentdata:ro
      # 邮箱仅授权爱玛士（默认 profile）：空卷遮蔽共享卷上的邮箱配置与 token
      - email-config-none:/opt/data/.config/himalaya
      - email-tokens-none:/opt/data/.config/ortie

    environment:
      - GH_TOKEN=${GH_TOKEN:-}              # gh CLI natively reads this (不会被 Hermes 黑名单匹配)
      - GITHUB_TOKEN=${GH_TOKEN:-}
      - GITCODE_TOKEN=${GITCODE_TOKEN:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - KIMI_CN_API_KEY=${MOONSHOT_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XIAOMI_API_KEY=${XIAOMI_API_KEY:-}       # Xiaomi MiMo — 主模型已切 deepseek-flash，此注入当前无消费方（待清理）
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LARK_CLI_APP_ID=${LARK_CLI_APP_ID:-}
      - LARK_CLI_APP_SECRET=${LARK_CLI_APP_SECRET:-}
      - LARK_USER_OPEN_ID=${LARK_USER_OPEN_ID:-}
      - LARK_CLI_IDM_APP_ID=${LARK_CLI_IDM_APP_ID:-}
      - LARK_CLI_IDM_APP_SECRET=${LARK_CLI_IDM_APP_SECRET:-}
      - RCLONE_CONFIG=/opt/data/rclone/rclone.conf
      - HERMES_PROFILE=coder
      # Discord (爱码士 coder)
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_ALLOWED_USERS=${DISCORD_ALLOWED_USERS:-}
      - DISCORD_REQUIRE_MENTION=true
      # Paper pipeline
      - PAPER_FETCH_DIR=/opt/data/skills/paper-fetch
      - ZOTERO_CONFIG_PATH=/opt/data/.config/zot/config.toml
      - GDRIVE_PAPERS_LOCAL_PATH=${GDRIVE_PAPERS_LOCAL_PATH:-}
      - ZOT_DATA_DIR=/opt/zotero-data
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID:-}
      - ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE:-user}
      # 语雀 MCP 访问 key：Hermes MCP 客户端按 ${VAR} 展开 config.yaml 的
      # Authorization Bearer header；不注入容器环境则展开为空 → 401 连接失败。
      - MCP_YUQUE_MCP_API_KEY=${MCP_YUQUE_MCP_API_KEY:-}
      - MEMORY_TENCENTDB_GATEWAY_HOST=tdai-memory
      - MEMORY_TENCENTDB_GATEWAY_PORT=8420
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_DOMAIN=feishu
      - FEISHU_CONNECTION_MODE=websocket
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - myopenclaw-net

  # ── Hermes finance gateway（产业财经咨询）────────────────────
  hermes-finance:
    image: myopenclaw/hermes:latest
    container_name: hermes-finance
    restart: unless-stopped
    command: gateway run --profile finance
    ports:
      - "${HERMES_FINANCE_PORT:-8644}:8642"
    volumes:
      - ${HOME}/.hermes:/opt/data
      - ${HOME}/.config/gh:/opt/gh-config
      - ${HOME}/.config/opencode:/opt/opencode-config
      - ${HOME}/.lark-cli:/opt/lark-config
      - ${HOME}/Zotero:/opt/zotero-data:ro
      # 邮箱仅授权爱玛士（默认 profile）：空卷遮蔽共享卷上的邮箱配置与 token
      - email-config-none:/opt/data/.config/himalaya
      - email-tokens-none:/opt/data/.config/ortie

    environment:
      - GH_TOKEN=${GH_TOKEN:-}              # gh CLI natively reads this (不会被 Hermes 黑名单匹配)
      - GITHUB_TOKEN=${GH_TOKEN:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - KIMI_CN_API_KEY=${MOONSHOT_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LARK_CLI_APP_ID=${LARK_CLI_APP_ID:-}
      - LARK_CLI_APP_SECRET=${LARK_CLI_APP_SECRET:-}
      - LARK_USER_OPEN_ID=${LARK_USER_OPEN_ID:-}
      - LARK_CLI_IDM_APP_ID=${LARK_CLI_IDM_APP_ID:-}
      - LARK_CLI_IDM_APP_SECRET=${LARK_CLI_IDM_APP_SECRET:-}
      - RCLONE_CONFIG=/opt/data/rclone/rclone.conf
      - HERMES_PROFILE=finance
      - ZOT_DATA_DIR=/opt/zotero-data
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID:-}
      - ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE:-user}
      - GDRIVE_PAPERS_LOCAL_PATH=${GDRIVE_PAPERS_LOCAL_PATH:-}
      # 语雀 MCP 访问 key：Hermes MCP 客户端按 ${VAR} 展开 config.yaml 的
      # Authorization Bearer header；不注入容器环境则展开为空 → 401 连接失败。
      # ~/.hermes/.env 里的同名变量不参与 MCP 客户端展开。
      - MCP_YUQUE_MCP_API_KEY=${MCP_YUQUE_MCP_API_KEY:-}
      - MEMORY_TENCENTDB_GATEWAY_HOST=tdai-memory
      - MEMORY_TENCENTDB_GATEWAY_PORT=8420
      - FEISHU_APP_ID=${FINANCE_FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FINANCE_FEISHU_APP_SECRET:-}
      - FEISHU_DOMAIN=feishu
      - FEISHU_CONNECTION_MODE=websocket
      - FEISHU_GROUP_POLICY=open
      - GATEWAY_ALLOW_ALL_USERS=true
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - myopenclaw-net

  # ── Hermes daoyuan gateway（道元·文献学者）─────────────────────
  hermes-daoyuan:
    image: myopenclaw/hermes:latest
    container_name: hermes-daoyuan
    restart: unless-stopped
    command: gateway run --profile daoyuan
    ports:
      - "${HERMES_DAOYUAN_PORT:-8645}:8642"
    volumes:
      - ${HOME}/.hermes:/opt/data
      - ${HOME}/.config/gh:/opt/gh-config
      - ${HOME}/.config/opencode:/opt/opencode-config
      - ${HOME}/.lark-cli:/opt/lark-config
      - ${HOME}/Zotero:/opt/zotero-data:ro
      # 邮箱仅授权爱玛士（默认 profile）：空卷遮蔽共享卷上的邮箱配置与 token
      - email-config-none:/opt/data/.config/himalaya
      - email-tokens-none:/opt/data/.config/ortie

    environment:
      - GH_TOKEN=${GH_TOKEN:-}              # gh CLI natively reads this (不会被 Hermes 黑名单匹配)
      - GITHUB_TOKEN=${GH_TOKEN:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - KIMI_CN_API_KEY=${MOONSHOT_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LARK_CLI_APP_ID=${LARK_CLI_APP_ID:-}
      - LARK_CLI_APP_SECRET=${LARK_CLI_APP_SECRET:-}
      - LARK_USER_OPEN_ID=${LARK_USER_OPEN_ID:-}
      - LARK_CLI_IDM_APP_ID=${LARK_CLI_IDM_APP_ID:-}
      - LARK_CLI_IDM_APP_SECRET=${LARK_CLI_IDM_APP_SECRET:-}
      - RCLONE_CONFIG=/opt/data/rclone/rclone.conf
      - HERMES_PROFILE=daoyuan
      # 语雀 MCP 访问 key：Hermes MCP 客户端按 ${VAR} 展开 config.yaml 的
      # Authorization Bearer header；不注入容器环境则展开为空 → 401 连接失败。
      - MCP_YUQUE_MCP_API_KEY=${MCP_YUQUE_MCP_API_KEY:-}
      # 道元不共享 TDAI memory — memory_enabled: false，独立记忆体系
      # Feishu (道元·文献学者 — 开放给群内所有人)
      - FEISHU_APP_ID=${DAOYUAN_FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${DAOYUAN_FEISHU_APP_SECRET:-}
      - FEISHU_DOMAIN=feishu
      - FEISHU_CONNECTION_MODE=websocket
      - FEISHU_GROUP_POLICY=open
      - GATEWAY_ALLOW_ALL_USERS=true
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - myopenclaw-net

  # ── Hermes dashboard（可选，只读，与 gateway 同网络）─────────
  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    command: dashboard --host 0.0.0.0
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HOME}/.hermes:/opt/data
    environment:
      - GATEWAY_HEALTH_URL=http://hermes:8642
    depends_on:
      - hermes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - myopenclaw-net

  # ── Claude Code + cc-connect（独立编码 Agent，飞书直连）──────
  claude-code:
    build:
      context: .
      dockerfile: docker/claude-code/Dockerfile
    image: myopenclaw/claude-code:latest
    container_name: claude-code
    restart: unless-stopped
    volumes:
      - ${HOME}/.claude:/opt/claude-config
      - ${HOME}/.config/gh:/opt/gh-config
      - ${HOME}/.cc-connect:/opt/cc-config
      - ${HOME}/.gitcode:/opt/gitcode-config
      - ${HOME}/code:/home/node/code
      - ${HOME}/Code:/home/node/Code
      - ${HOME}/.myagentdata:/home/node/.myagentdata
      - ${HOME}/code/dailyinfo/skills:/opt/dailyinfo-skills:ro
      - ./docker/tdai-memory/mcp-server/server.py:/opt/tdai-mcp-server.py:ro
      - ./docker/claude-code/capture-to-gateway.py:/opt/capture-to-gateway.py:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      - CC_CONNECT_FEISHU_APP_ID=${CC_CONNECT_FEISHU_APP_ID:-}
      - CC_CONNECT_FEISHU_APP_SECRET=${CC_CONNECT_FEISHU_APP_SECRET:-}
      - GH_TOKEN=${GH_TOKEN:-}              # gh CLI natively reads this (不会被 Hermes 黑名单匹配)
      - GITHUB_TOKEN=${GH_TOKEN:-}
      - GITCODE_TOKEN=${GITCODE_TOKEN:-}
      - DAILYINFO_DATA_ROOT=/home/node/.myagentdata/dailyinfo
      - MEMORY_TENCENTDB_GATEWAY_HOST=tdai-memory
      - MEMORY_TENCENTDB_GATEWAY_PORT=8420
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${CC_CONNECT_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1g"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    networks:
      - myopenclaw-net

  # ── Zotero MCP — 共享文献查询与分析服务 ─────────────────────────
  zotero-mcp:
    build:
      context: ./docker/zotero-mcp
      dockerfile: Dockerfile
      args:
        - GITHUB_TOKEN=${GH_TOKEN:-}
    image: myopenclaw/zotero-mcp:latest
    container_name: zotero-mcp
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - ZOTERO_API_KEY=${ZOTERO_API_KEY:-}
      - ZOTERO_LIBRARY_ID=${ZOTERO_LIBRARY_ID:-}
      - ZOTERO_LIBRARY_TYPE=${ZOTERO_LIBRARY_TYPE:-user}
      - ZOTERO_LOCAL_API_URL=http://host.docker.internal:23119
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - myopenclaw-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── paper-queue MCP（论文清单）────────────────────────────────
  # ⚠️ 队列目录**只挂给这个容器**，openclaw-gateway 不挂 —— 虾酱（LLM 驱动、可被
  # 提示注入）实测能 read/write 那个目录，挂在一起时它可以绕开一切校验直接改库。
  # 搬出来之后它只能走这个 MCP 接口，签名与身份校验在那里生效。
  paper-queue-mcp:
    build:
      context: ./docker/paper-queue-mcp
      dockerfile: Dockerfile
    image: myopenclaw/paper-queue-mcp:latest
    container_name: paper-queue-mcp
    restart: unless-stopped
    ports:
      - "${PAPER_QUEUE_MCP_PORT:-8003}:8003"
    volumes:
      - ${HOME}/.myagentdata/paper-queue:/data
    environment:
      - PAPER_QUEUE_DB=/data/queue.sqlite
      # 与插件共享的归属签名密钥（同一份写在 openclaw.json 的插件 config 里）。
      # 两边必须一致，否则每次写入都会被拒 —— 有守卫钉着。
      - PAPER_QUEUE_ACTOR_SECRET=${PAPER_QUEUE_ACTOR_SECRET:-}
    networks:
      - myopenclaw-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── OpenClaw gateway ─────────────────────────────────────────
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.1}
    container_name: openclaw-gateway
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "/fix-host-paths.sh && exec /usr/local/bin/docker-entrypoint.sh node openclaw.mjs gateway --allow-unconfigured"]
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ${HOME}/.openclaw:/home/node/.openclaw
      # 论文清单的库**刻意不挂在这里**：虾酱实测能 read/write 那个目录（exec 被
      # allowlist 挡住，文件工具没有），挂在一起它就能绕开校验直接改库。队列目录
      # 只挂给 paper-queue-mcp，虾酱只能走 MCP 接口。
      - ./openclaw/scripts/fix-host-paths.sh:/fix-host-paths.sh:ro
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - XIAOMI_API_KEY=${XIAOMI_API_KEY:-}       # Xiaomi MiMo — 虾酱 TTS 语音回复（mimo-v2.5-tts）
      - UNPAYWALL_EMAIL=${UNPAYWALL_EMAIL:-}
      - PAPER_FETCH_NO_SCIHUB=${PAPER_FETCH_NO_SCIHUB:-}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${OPENCLAW_GH_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - myopenclaw-net

  # ── OpenClaw CLI（按需运行，不常驻）─────────────────────────
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.1}
    container_name: openclaw-cli
    profiles:
      - cli
    volumes:
      - ${HOME}/.openclaw:/home/node/.openclaw
    network_mode: "service:openclaw-gateway"
    depends_on:
      - openclaw-gateway

  # ── Uptime Kuma（服务监控面板）──────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - ${HOME}/.uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - myopenclaw-net

  # ── FreshRSS（dailyinfo RSS 订阅源）───────────────────────────
  freshrss:
    image: freshrss/freshrss:latest
    container_name: dailyinfo_freshrss
    restart: unless-stopped
    ports:
      - "${FRESHRSS_PORT:-8081}:80"
    volumes:
      - ${HOME}/.myagentdata/dailyinfo/freshrss/data:/var/www/FreshRSS/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CRON_MIN=*/15
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - myopenclaw-net

  # ── 定时快照备份 ─────────────────────────────────────────────
  backup-cron:
    build:
      context: ./docker/backup-cron
      dockerfile: Dockerfile
    container_name: backup-cron
    restart: unless-stopped
    volumes:
      - ${HOME}/.hermes:/root/.hermes:ro
      - ${HOME}/.openclaw:/root/.openclaw:ro
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.cc-connect:/root/.cc-connect:ro
      - ${HOME}/.myagentdata:/.myagentdata:ro
      # 心跳目录：窄口径 RW。整个 /.myagentdata 是只读挂载，但备份跑完要往这里
      # 写一份心跳供宿主的 collect_agentops.py 读 —— 心跳**不能**放云盘目录：
      # 实测云盘对宿主进程的可见性按进程上下文分裂（launchd 能 readdir 云盘根却
      # 读不了文件，交互式 shell 反过来），只有本地路径两边都读得到。
      # 每个 RW 例外都必须是这样的窄子目录挂载，不把整个 agent 数据目录变成可写。
      - ${HOME}/.myagentdata/agentops:/.agentops:rw
      # 热备用的**嵌套 RW**（父目录是上面那条 /.myagentdata:ro）。WAL 库的读者也要
      # 在 wal-index 里加锁（写 `-shm`）—— 只读挂载上连普通 SELECT 都 CANTOPEN，
      # 2026-09-18~21 每晚 02:00 的 data 备份就是这么连续失败的（快照里只剩 0 字节
      # 假文件）。审计确认三个 WAL 库各需一条，与 backup-data.sh 的 HOT_DBS_RW
      # 清单一一对应（回滚模式的库走 `-readonly`，不需要挂载）。
      # Docker 对嵌套挂载按「子路径后应用」覆盖父路径（2026-09-21 实测）。
      - ${HOME}/.myagentdata/paper-queue:/.myagentdata/paper-queue:rw
      - ${HOME}/.myagentdata/tdai-memory:/.myagentdata/tdai-memory:rw
      - ${HOME}/.myagentdata/repo-scanner:/.myagentdata/repo-scanner:rw
      # hermes 的 cron 活库（executions.db，WAL）同款：父目录 ~/.hermes 保持只读
      - ${HOME}/.hermes/cron:/root/.hermes/cron:rw
      - ${BACKUP_ROOT:-/tmp/myopenclaw-backups}:/backup:rw
      - ./hermes/scripts:/hermes-scripts:ro
      - ./openclaw/scripts:/openclaw-scripts:ro
      - ./claude/scripts:/claude-scripts:ro
      - ./scripts:/scripts:ro
      - ./tdai-memory/scripts:/tdai-scripts:ro
    environment:
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - myopenclaw-net

  # ── aisecretary — 事务数据库 MCP 服务 ──────────────────────
  aisecretary:
    build:
      context: ../aisecretary
      dockerfile: Dockerfile
    image: myopenclaw/aisecretary:latest
    container_name: aisecretary
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/data/transactions.sqlite
    volumes:
      - ${HOME}/.myagentdata/aisecretary:/data
    networks:
      - myopenclaw-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── repo-scanner MCP — 每日研发贡献报告数据服务 ──────────────
  repo-scanner-mcp:
    build:
      context: ../git-contribution-stats
      dockerfile: docker/mcp-server/Dockerfile
    image: myopenclaw/repo-scanner-mcp:latest
    container_name: repo-scanner-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ${HOME}/.myagentdata/repo-scanner:/data:ro
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - REPO_SCANNER_DB_PATH=/data/repos.sqlite
    networks:
      - myopenclaw-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── 语雀 MCP（本机自持只读 token 的快照/变更服务）─────────────
  # 上游 gitcode.com/dlut-water/yuque_mcp_server（无 tag，pin bfc55d7，守卫
  # tests/test_yuque_mcp_local.py 钉兄弟仓 HEAD）。校内 10.48.0.81 那套继续给
  # 团队成员走 UniVPN；本机这套只服务本机消费者（hermes 默认 profile + 天一）。
  # 镜像默认 uid 10001 写不进 macOS 宿主目录；只持只读语雀 token，无本地安全
  # 边界，root 运行（tianyi compose 先例；Linux 侧会生 root-owned 文件，见文档）。
  # 不发布宿主端口：仅 myopenclaw-net 内可达（Uptime Kuma / Hermes / 天一按容器名直连）
  # —— 网络边界即"全 net 可达"，Bearer key（MCP_API_KEY）是唯一门；key 为空 = 无
  # 认证直通（上游行为），故 start.sh 缺键警告 + Uptime Kuma 只接受 401 探针。
  yuque-mcp:
    build:
      context: ../yuque_mcp_server
      dockerfile: Dockerfile
    image: myopenclaw/yuque-mcp:latest
    container_name: yuque-mcp
    restart: unless-stopped
    user: root
    volumes:
      # 快照 + change_summary.db + snapshots/ 正文（代码默认路径，无需 env 覆盖）
      - ${HOME}/.myagentdata/yuque-mcp/change_data:/app/yuque/change_data
      # backup_repo 工具输出根（server.py 里 _BACKUP_ROOT 硬编码，无 env 可覆盖）
      - ${HOME}/.myagentdata/yuque-mcp/backup:/app/yuque/backup
    environment:
      - RUN_MODE=cloud
      - PORT=18001
      # 服务端消费的 key 与客户端同源：.env 一处定义（不一致 ⇒ 每次请求 401）
      - MCP_API_KEY=${MCP_YUQUE_MCP_API_KEY:-}
      # 语雀只读 token（repo:read + doc:read；要编辑者姓名再加 group:read）——唯一人工前置
      - YUQUE_TOKEN=${YUQUE_TOKEN:-}
      # 监控知识库（缺省时服务端回退到内置两库，会静默丢掉「建设方案」）
      - YUQUE_CHANGE_REPOS_JSON=${YUQUE_CHANGE_REPOS_JSON:-}
      - YUQUE_CHANGE_SNAPSHOT_TIME=${YUQUE_CHANGE_SNAPSHOT_TIME:-06:00}
      - YUQUE_CHANGE_REPORT_TIME=${YUQUE_CHANGE_REPORT_TIME:-07:00}
      - YUQUE_CHANGE_TIMEZONE=${YUQUE_CHANGE_TIMEZONE:-Asia/Shanghai}
      # 快照保留期：显式钉 90 天（旧版仅遗留函数里硬编码 30、调度路径从不 prune；
      # bfc55d7 起每轮采集后真正清理，默认 90 —— 不钉就跟着上游默认漂）。
      # cleanup 永远保护每库最近 2 个完整 run（与保留期无关），change_reports 不删。
      - YUQUE_CHANGE_RETENTION_DAYS=${YUQUE_CHANGE_RETENTION_DAYS:-90}
    networks:
      - myopenclaw-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── TDAI Memory Gateway（Agent 长期记忆 L0→L3 分层管线）───────
  tdai-memory:
    build:
      context: ./docker/tdai-memory
      dockerfile: Dockerfile
    image: myopenclaw/tdai-memory:latest
    container_name: tdai-memory
    restart: unless-stopped
    ports:
      - "${TDAI_MEMORY_PORT:-8420}:8420"
    volumes:
      - ${HOME}/.myagentdata/tdai-memory:/opt/data/tdai-memory
    environment:
      - TDAI_LLM_API_KEY=${DEEPSEEK_API_KEY:-}
      - TDAI_LLM_BASE_URL=${TDAI_LLM_BASE_URL:-https://api.deepseek.com/v1}
      - TDAI_LLM_MODEL=${TDAI_LLM_MODEL:-deepseek-chat}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    networks:
      - myopenclaw-net

networks:
  myopenclaw-net:
    driver: bridge

# 邮箱能力收敛到爱玛士（默认 profile）：受限 profile（爱码士/道元/finance）
# 用这两个恒空卷遮蔽共享卷上的邮箱路径——配置与 token 对其不可见
volumes:
  email-config-none:
  email-tokens-none:
