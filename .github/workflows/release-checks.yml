name: Release checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version, tests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group docs

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Verify tag matches project version
        run: |
          version="$(uv version --short)"
          echo "project version: ${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match v${version}" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/agent-bind/package-lock.json

      - name: Install the Feishu bind tool
        run: npm ci --prefix services/agent-bind

      - name: Build backup-cron image
        # 容器内热备用例（tests/test_ops_defaults.py::TestHermesCronDbHotCopyInContainer）
        # 要跑在**生产镜像**里：Alpine + sqlite 3.45.x。宿主的 sqlite（macOS Apple
        # 3.54 / Ubuntu runner 3.45.x）行为不同，2026-11-16 因此出过「本机红 / CI 绿」。
        run: docker build --tag myopenclaw-backup-cron:ci ./docker/backup-cron

      - name: Run tests
        env:
          # 让容器内热备用例用上面这个镜像；不设则回退默认名，缺失即 skip
          BACKUP_CRON_IMAGE: myopenclaw-backup-cron:ci
        run: uv run --with pytest --with pyyaml --with pylatexenc pytest tests/ -q

      - name: Build docs strictly
        run: uv run mkdocs build --strict

# 这个工作流只做发布校验：不创建 tag、不创建 GitHub Release、不上传 PyPI。
