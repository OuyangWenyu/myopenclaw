# Apply after the existing docker-compose.zhixun-bot.yml.
services:
  zhixun-water-mcp:
    profiles: !reset []
    build: !reset null
    image: ${ZHIXUN_WATER_AUTH_IMAGE:?Set the verified authentication image}
    command: [python, /opt/water-auth/authenticated_entrypoint.py, sse, --host, 0.0.0.0, --port, "18201"]
    ports:
      - "10.48.0.81:18201:18201"
    environment:
      ZHIXUN_AGENT_API_KEYS_FILE: /run/secrets/water-mcp-keys.json
    volumes:
      - ${ZHIXUN_WATER_KEYS_FILE:?Set the key map path}:/run/secrets/water-mcp-keys.json:ro

  openclaw-zhixun:
    environment:
      ZHIXUN_BOT_WATER_MCP_URL: http://zhixun-water-mcp:18201/sse
      ZHIXUN_BOT_WATER_MCP_TRANSPORT: sse
      ZHIXUN_BOT_WATER_MCP_TOKEN: ""
      ZHIXUN_BOT_WATER_MCP_TOKEN_FILE: /run/secrets/water-mcp-token
    depends_on:
      zhixun-water-mcp:
        condition: service_healthy
    volumes:
      - ${ZHIXUN_WATER_TOKEN_FILE:?Set the OpenClaw token path}:/run/secrets/water-mcp-token:ro
