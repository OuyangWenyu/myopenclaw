name: myopenclaw-tianyi-bot

services:
  openclaw-tianyi:
    image: ${TIANYI_BOT_OPENCLAW_IMAGE:-docker.m.daocloud.io/openclaw/openclaw:2026.9.1}
    container_name: openclaw-tianyi
    restart: unless-stopped
    user: root
    entrypoint:
      - /bin/sh
      - /opt/tianyi-bot/entrypoint.sh
    volumes:
      - ${TIANYI_BOT_DATA_DIR:-${HOME}/.openclaw-tianyi}:/home/node/.openclaw
      - ./docker/tianyi-bot:/opt/tianyi-bot:ro
      - ./openclaw-tianyi/workspace:/opt/tianyi-workspace:ro
    environment:
      HOME: /home/node
      TZ: ${TZ:-Asia/Shanghai}
      TIANYI_BOT_MODEL_API_KEY: ${TIANYI_BOT_MODEL_API_KEY:?Model API key required}
      TIANYI_BOT_FEISHU_APP_ID: ${TIANYI_BOT_FEISHU_APP_ID:?Feishu App ID required}
      TIANYI_BOT_FEISHU_APP_SECRET: ${TIANYI_BOT_FEISHU_APP_SECRET:?Feishu App Secret required}
      TIANYI_BOT_FEISHU_STREAMING: ${TIANYI_BOT_FEISHU_STREAMING:-false}
      TIANYI_BOT_MODEL_ID: ${TIANYI_BOT_MODEL_ID:-deepseek-flash}
      TIANYI_BOT_MODEL_BASE_URL: ${TIANYI_BOT_MODEL_BASE_URL:-https://api.deepseek.com}
      # GLM 兜底模型（可选）：主模型不可用时自动切换（fallbacks = zhipu/glm-5.3-flash）
      TIANYI_BOT_GLM_API_KEY: ${TIANYI_BOT_GLM_API_KEY:-}
      TIANYI_BOT_GITHUB_TOKEN: ${TIANYI_BOT_GITHUB_TOKEN:-}
      TIANYI_BOT_GITCODE_TOKEN: ${TIANYI_BOT_GITCODE_TOKEN:-}
      # 仓库动态 MCP（必需能力）。未设 = 渲染器回落主栈同网默认地址
      # （http://repo-scanner-mcp:8001/mcp，行为与参数化前一致）；
      # 仅当服务不在同网（如天一部署到团队服务器由外部消费）才覆盖。
      TIANYI_BOT_REPO_SCANNER_MCP_URL: ${TIANYI_BOT_REPO_SCANNER_MCP_URL:-}
      TIANYI_BOT_REPO_SCANNER_KEY: ${TIANYI_BOT_REPO_SCANNER_KEY:-}
      # 本机语雀 MCP（主栈 yuque-mcp 服务；URL 留空则渲染时移除 yuque-mcp 条目）
      TIANYI_BOT_YUQUE_MCP_URL: ${TIANYI_BOT_YUQUE_MCP_URL:-}
      TIANYI_BOT_MCP_YUQUE_MCP_API_KEY: ${TIANYI_BOT_MCP_YUQUE_MCP_API_KEY:-}
      MCP_YUQUE_MCP_API_KEY: ${TIANYI_BOT_MCP_YUQUE_MCP_API_KEY:-}
      # 服务器监控 MCP（团队 server-monitoring，HTTPS + Bearer + 内网 CA；
      # URL 留空则渲染时移除 server-monitoring 条目，能力完全关闭）
      TIANYI_BOT_SERVER_MONITORING_MCP_URL: ${TIANYI_BOT_SERVER_MONITORING_MCP_URL:-}
      TIANYI_BOT_MCP_SERVER_MONITORING_TOKEN: ${TIANYI_BOT_MCP_SERVER_MONITORING_TOKEN:-}
      MCP_SERVER_MONITORING_TOKEN: ${TIANYI_BOT_MCP_SERVER_MONITORING_TOKEN:-}
      # 每日监控摘要 automation（entrypoint 幂等声明；URL 非空才启用）
      TIANYI_BOT_OWNER_OPEN_ID: ${TIANYI_BOT_OWNER_OPEN_ID:-}
      TIANYI_BOT_MONITORING_DIGEST_CRON: ${TIANYI_BOT_MONITORING_DIGEST_CRON:-}
      # URL 非空才信任内网 CA（空串时 node 静默忽略，关闭态行为不变）；
      # CA 证书随仓库提供，经 ./docker/tianyi-bot 只读挂载进容器
      NODE_EXTRA_CA_CERTS: ${TIANYI_BOT_SERVER_MONITORING_MCP_URL:+/opt/tianyi-bot/ca/server-monitoring-ca.pem}
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:18792/healthz
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    networks:
      - myopenclaw-net

networks:
  myopenclaw-net:
    external: true
    name: myopenclaw_myopenclaw-net
