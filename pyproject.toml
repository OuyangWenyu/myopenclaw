[project]
name = "myopenclaw"
version = "0.2.10"
description = "个人操作系统——实用Agents管理 — Docker Compose 部署文档"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "mkdocs-material>=9.6",
]
# 全量守卫测试用（`uv run --group dev pytest tests/ -q`）。
# pylatexenc 是 test_feishu_latex 的 importorskip 依赖：缺它那条会静默 skip。
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "pylatexenc>=2.10",
]

[tool.uv]
package = false
